<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressive Bytes - Apps for Apple Devices (iOS, iPadOS, macOS, watchOS)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Progressive Bytes</h1>
        <p class="subtitle">Smart Apps. Done Right.</p>
    </header>

    <main class="app-grid">
        <div class="app-card">
            <div class="app-card-inner">
                <a href="checkomat/" class="card-link-overlay" aria-label="View Checkomat app details"></a>
                <img src="checkomat/images/AppIcon.webp" alt="Checkomat Icon" class="app-icon">
                <h2>Checkomat</h2>
                <p>Checklist, To-Do & Task Manager</p>

                <div class="badge-container">
                    <a href="https://apps.apple.com/us/app/id6747260188" target="_blank" rel="noopener"
                        class="badge-link">
                        <img src="images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
                            alt="Download on the App Store" class="download-cta-badge">
                    </a>
                </div>
            </div>
        </div>

        <div class="app-card">
            <div class="app-card-inner">
                <a href="settleasy/" class="card-link-overlay" aria-label="View Settleasy app details"></a>                <img src="settleasy/images/AppIcon.webp" alt="Settleasy Icon" class="app-icon">
                <h2>Settleasy</h2>
                <p>Household & Group Expense Splitter</p>

                <div class="badge-container">
                    <a href="https://apps.apple.com/us/app/id6747769253" target="_blank" rel="noopener"
                        class="badge-link">
                        <img src="images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
                            alt="Download on the App Store" class="download-cta-badge">
                    </a>
                </div>
            </div>
        </div>

        <div class="app-card">
            <div class="app-card-inner">
                <a href="budgetbear/" class="card-link-overlay" aria-label="View BudgetBear app details"></a>
                <img src="budgetbear/images/AppIcon.webp" alt="BudgetBear Icon" class="app-icon">
                <h2>BudgetBear</h2>
                <p>Savings Tracker & Purchase Goal Planner</p>

                <div class="badge-container">
                    <a href="https://apps.apple.com/us/app/id6759972859" target="_blank" rel="noopener"
                        class="badge-link">
                        <img src="images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
                            alt="Download on the App Store" class="download-cta-badge">
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025-2026 Progressive Bytes. All rights reserved.</p>
        <nav>
            <a href="privacy.html">Privacy Policy</a>
            <a href="contact.html">Contact</a>
        </nav>
    </footer>
</body>

</html>
